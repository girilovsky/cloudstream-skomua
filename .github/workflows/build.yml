name: Build SkomUA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skomua-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build extension
        run: |
          chmod +x gradlew
          ./gradlew :SkomUA:make makePluginsJson --stacktrace
      - name: Prepare repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p publish
          cp SkomUA/build/*.cs3 publish/
          cp build/plugins.json publish/
          python3 - <<'PY'
          import json, os, pathlib
          repo = os.environ['REPOSITORY']
          manifest = {'name': 'SkomUA', 'description': 'Українські переозвучки, фільми, серіали та стендапи', 'manifestVersion': 1, 'pluginLists': [f'https://raw.githubusercontent.com/{repo}/builds/plugins.json']}
          pathlib.Path('publish/repo.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SkomUA
          path: publish/
      - name: Publish builds branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd publish
          git init -b builds
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Build SkomUA ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin builds
